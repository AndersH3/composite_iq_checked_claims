[pytest]
# Policy: all unrecognized Python warnings are CI failures, including warnings
# from repository code and future dependency upgrades. The only exceptions
# below are two pre-existing Python 3.13 regex-module deprecations emitted by
# deal-solver==0.1.2 (released 2023), which has no newer PyPI release.
# This is a narrow diagnostic quarantine, NOT a fix to that upstream library.
# On replacing/upgrading deal-solver, delete these exceptions and run
# `python -m pytest -q tests` to verify zero deprecations.
#
# The 7,034 other warnings formerly emitted by deal/deal-solver's deprecated
# astroid top-level node access were resolved by pinning astroid==3.3.11.
filterwarnings =
    error
    ignore:^module 'sre_constants' is deprecated$:DeprecationWarning:deal_solver\._proxies\._pattern
    ignore:^module 'sre_parse' is deprecated$:DeprecationWarning:deal_solver\._proxies\._pattern
