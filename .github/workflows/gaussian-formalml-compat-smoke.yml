name: FormalML Rocq 9.2 compatibility smoke

on:
  push:
    paths:
      - 'scripts/patch_formalml_9_2.sh'
      - '.github/workflows/gaussian-formalml-compat-smoke.yml'
  # Push already checks every same-repository commit. Avoid redundant
  # synchronization runs that repeat the identical pinned Rocq build.
  pull_request:
    types: [opened, reopened]
    paths:
      - 'scripts/patch_formalml_9_2.sh'
      - '.github/workflows/gaussian-formalml-compat-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rocq-utility-proof-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out pinned patch source
        uses: actions/checkout@v4
      # Shell scripts must be ShellCheck-clean before any invocation.
      # The Ubuntu GitHub runner ships ShellCheck; fail closed if absent.
      - name: ShellCheck FormalML compatibility script before execution
        shell: bash
        run: |
          command -v shellcheck
          shellcheck --shell=sh --severity=warning scripts/patch_formalml_9_2.sh

      - name: Check exact upstream utility modules without full probability dependency build
        shell: bash
        run: |
          docker run --rm -v "$PWD:/workspace:ro" rocq/rocq-prover:9.2.0 sh -euc '
            git clone --filter=blob:none --no-checkout https://github.com/IBM/FormalML.git /tmp/FormalML
            cd /tmp/FormalML
            git fetch --depth 1 origin 8ee433dc802fca35f6bceb6dacb69d3c1315e886
            git checkout --detach 8ee433dc802fca35f6bceb6dacb69d3c1315e886
            sh /workspace/scripts/patch_formalml_9_2.sh
            cd rocq/lib_utils
            rocq compile LibUtilsCoqLibAdd.v
            rocq compile LibUtilsLift.v
            rocq compile LibUtilsListAdd.v
            rocq compile LibUtilsStringAdd.v
            rocq compile LibUtilsSortingAdd.v
            rocq compile LibUtilsAssoc.v
            rocq compile LibUtilsSublist.v
            rocq compile LibUtilsCompat.v
            # Lookup correctness is a dependency of the Gaussian CE build.
            rocq compile LibUtilsBindings.v
          '
