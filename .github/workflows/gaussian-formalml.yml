name: Gaussian conditional expectation (FormalML)

on:
  push:
    paths:
      - 'analyses/sequential-conditional-means/formalml/**'
      - '.github/workflows/gaussian-formalml.yml'
  pull_request:
    paths:
      - 'analyses/sequential-conditional-means/formalml/**'
      - '.github/workflows/gaussian-formalml.yml'
  workflow_dispatch:

jobs:
  gaussian-measure-theoretic-ce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@v4

      - name: Check no assumed Gaussian CE or unfinished proof
        shell: bash
        run: |
          if grep -nE '^[[:space:]]*(Admitted|Axiom|Axioms|Parameter|Parameters|Conjecture|Abort)[[:space:].:]' \
             analyses/sequential-conditional-means/formalml/*.v; then
            echo 'FormalML Gaussian CE cannot use new axioms or placeholders.' >&2
            exit 1
          fi
          test "$(grep -c '^Theorem ' analyses/sequential-conditional-means/formalml/GaussianResidualConditionalExpectation.v)" -eq 2

      - name: Verify FormalML measure-theoretic Gaussian CE proof with Rocq 9.2
        shell: bash
        run: |
          docker run --rm -v "$PWD:/workspace:ro" rocq/rocq-prover:9.2.0 sh -euc '
            opam repository set-url rocq-released https://rocq-prover.org/opam/released -y
            opam update -y
            git clone --depth 1 https://github.com/IBM/FormalML.git /tmp/FormalML
            cd /tmp/FormalML
            opam install -y -j 2 --deps-only .
            opam exec -- make -j 2
            mkdir -p /tmp/formalml-gaussian
            cp /workspace/analyses/sequential-conditional-means/formalml/GaussianResidualConditionalExpectation.v /tmp/formalml-gaussian/
            cd /tmp/formalml-gaussian
            opam exec -- rocq compile -R /tmp/FormalML/rocq FormalML GaussianResidualConditionalExpectation.v
          '
