name: Gaussian regression conditional expectation (Lean mathlib)

on:
  push:
    paths:
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'analyses/sequential-conditional-means/lean/**'
      - '.github/workflows/gaussian-lean.yml'
  pull_request:
    paths:
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'analyses/sequential-conditional-means/lean/**'
      - '.github/workflows/gaussian-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gaussian-ce-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Reject Lean axioms and unproved placeholders
        run: |
          if grep -nE '(^|[[:space:]])(sorry|admit|axiom)[[:space:]]' \
            analyses/sequential-conditional-means/lean/*.lean; then
            echo "New axioms or unfinished Gaussian CE proofs are forbidden" >&2
            exit 1
          fi
          test "$(grep -c '^theorem ' analyses/sequential-conditional-means/lean/GaussianRegression.lean)" -ge 2
      - name: Compile Gaussian conditional expectation with pinned mathlib
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-github-cache: true
