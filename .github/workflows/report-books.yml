name: Build eight XeLaTeX books

on:
  push:
    paths:
      - 'analyses/**/*.tex'
      - 'reporting/*.tex'
      - 'library/latex/**'
      - 'scripts/check_report_template.sh'
      - '.github/workflows/report-books.yml'
  pull_request:
    paths:
      - 'analyses/**/*.tex'
      - 'reporting/*.tex'
      - 'library/latex/**'
      - 'scripts/check_report_template.sh'
      - '.github/workflows/report-books.yml'
  workflow_dispatch:

permissions:
  contents: write

# The eight PDFs form one atomic publication set per branch. Cancel stale
# builds when revised TeX arrives rather than pushing out-of-date binaries.
concurrency:
  group: report-books-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and shared report layout
        run: |
          git ls-files -z '*.sh' | xargs -0 -r shellcheck --severity=warning
          bash scripts/check_report_template.sh
      - name: Generate matrix from canonical book inventory
        id: matrix
        shell: bash
        run: |
          matrix=$(jq -Rsc 'split("\n") | map(select(length > 0) | split(" ") | {project: .[0], stem: .[1]}) | {include: .}' library/latex/books.txt)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  compile:
    needs: inventory
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The new simulation book is built from a freshly executed campaign.
      # The other books continue to use their previously retained inputs.
      - uses: actions/setup-python@v5
        if: matrix.stem == 'iq_difference_simulations'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install shared simulation dependencies
        if: matrix.stem == 'iq_difference_simulations'
        run: python -m pip install -r requirements-dev.txt
      - name: Execute full IQ discrepancy Dask campaign
        if: matrix.stem == 'iq_difference_simulations'
        run: make -C analyses/iq-test-differences data
      - name: Build with XeLaTeX, KOMA-Script and latexmk
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: analyses/${{ matrix.project }}
          root_file: ${{ matrix.stem }}.tex
          latexmk_use_xelatex: true
          args: -file-line-error -interaction=nonstopmode -halt-on-error -outdir=output/pdf
          extra_system_packages: "fontconfig"
        env:
          BIBINPUTS: "../../reporting//:.:"
      - name: Reject unresolved references in the final XeLaTeX pass
        shell: bash
        run: |
          log="analyses/${{ matrix.project }}/output/pdf/${{ matrix.stem }}.log"
          test -s "$log" || { echo "Missing final XeLaTeX log: $log" >&2; exit 1; }
          if grep -nE '(undefined on input line|There were undefined references|There were undefined citations)' "$log"; then
            echo "Unresolved TeX cross-reference or citation in $log" >&2
            exit 1
          fi
      - name: Stage compiled PDF under its repository path
        run: |
          test -s "analyses/${{ matrix.project }}/output/pdf/${{ matrix.stem }}.pdf"
          mkdir -p "assembled/analyses/${{ matrix.project }}/output/pdf"
          cp "analyses/${{ matrix.project }}/output/pdf/${{ matrix.stem }}.pdf" "assembled/analyses/${{ matrix.project }}/output/pdf/"
      - name: Stage generated IQ discrepancy results and provenance with the PDF
        if: matrix.stem == 'iq_difference_simulations'
        run: |
          mkdir -p assembled/analyses/iq-test-differences/simulation-data
          cp analyses/iq-test-differences/simulation-data/{summary.json,results.tex,run.tex} assembled/analyses/iq-test-differences/simulation-data/
      - uses: actions/upload-artifact@v4
        with:
          name: book-${{ matrix.stem }}
          path: assembled/
          retention-days: 14

  publish-branch-pdfs:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          pattern: book-*
          merge-multiple: true
          path: .
      - name: Commit PDFs corresponding to the revised TeX source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Publish only against the exact source revision that was built.
          # Never reparent older PDF/data bytes onto a newer source commit.
          git fetch origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          if [[ "$(git rev-parse "refs/remotes/origin/${GITHUB_REF_NAME}")" != "$GITHUB_SHA" ]]; then
            echo 'Source branch advanced; refusing stale PDF publication' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git add analyses/*/output/pdf/*.pdf
          git add analyses/iq-test-differences/simulation-data/{summary.json,results.tex,run.tex}
          if git diff --cached --quiet; then
            echo 'Compiled PDFs already match tracked bytes'
            exit 0
          fi
          git commit -m 'Rebuild all eight books from Python/Dask/Deal XeLaTeX source'
          # A non-force push fails if another writer advances the ref.
          git push origin "HEAD:${GITHUB_REF_NAME}"
