name: Dask scaled Monte Carlo benchmark (manual)

# This workflow never runs on push/PR: the full simulation can be expensive.
# It does not commit or overwrite the repository's published data assets.
# Its zipped results are a candidate for a separately reviewed provenance update.
on:
  workflow_dispatch:
    inputs:
      trials:
        description: 'Samples per replicate (2..100000000; select based on runner RAM)'
        required: true
        type: number
        default: 5000000
      chunk:
        description: 'Rows per worker task (recommended 250000..500000)'
        required: true
        type: number
        default: 500000
      replicates:
        description: 'Independent seed replicates (1..8)'
        required: true
        type: choice
        options: ['1', '2', '4', '8']
        default: '8'
      workers:
        description: 'Concurrent Dask workers; runner CPU/RAM bounds still apply'
        required: true
        type: choice
        options: ['1', '2', '4']
        default: '2'
      scheduler:
        description: 'Dask scheduling backend'
        required: true
        type: choice
        options: ['processes', 'distributed']
        default: 'processes'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TRIALS: ${{ inputs.trials }}
      CHUNK: ${{ inputs.chunk }}
      REPLICATES: ${{ inputs.replicates }}
      WORKERS: ${{ inputs.workers }}
      SCHEDULER: ${{ inputs.scheduler }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate lazy graph and print requested sample count
        run: |
          set -euo pipefail
          python -m reporting.simulate --plan --trials "$TRIALS" --chunk "$CHUNK" --replicates "$REPLICATES" --workers "$WORKERS" --scheduler "$SCHEDULER" | tee dask-plan.json
      - name: Draw and reduce synthetic Gaussian samples with memory/time diagnostics
        run: |
          set -euo pipefail
          extra=()
          if [[ "$SCHEDULER" == "distributed" ]]; then
            extra=(--memory-limit 2GiB --performance-report dask-performance.html)
          fi
          /usr/bin/time -v python -m reporting.simulate --trials "$TRIALS" --chunk "$CHUNK" --replicates "$REPLICATES" --workers "$WORKERS" --scheduler "$SCHEDULER" "${extra[@]}" 2> dask-resource-usage.txt | tee dask-run-result.json
      - name: Preserve candidate assets and diagnostics; never commit automatically
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dask-block-benchmark-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            dask-plan.json
            dask-run-result.json
            dask-resource-usage.txt
            dask-performance.html
            reporting/run.json
            analyses/*/simulation-data/*.csv
            analyses/*/simulation-data/*.json
            analyses/*/simulation-data/*.tex
