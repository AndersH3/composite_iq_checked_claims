name: Rocq proofs

on:
  push:
    paths:
      - 'rocq/**'
      - 'library/rocq/**'
      - 'analyses/**/rocq/**'
      - 'scripts/compile_rocq.sh'
      - '.github/workflows/rocq-proofs.yml'
      - 'scripts/check_rocq_documentation.sh'
  pull_request:
    paths:
      - 'rocq/**'
      - 'library/rocq/**'
      - 'analyses/**/rocq/**'
      - 'scripts/compile_rocq.sh'
      - '.github/workflows/rocq-proofs.yml'
      - 'scripts/check_rocq_documentation.sh'
  workflow_dispatch:

jobs:
  kernel-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check module headers and per-declaration proof documentation
        shell: bash
        run: bash scripts/check_rocq_documentation.sh

      - name: Reject unfinished proof placeholders and new axioms
        shell: bash
        run: |
          if grep -nE '^[[:space:]]*(Admitted|Axiom|Axioms|Parameter|Parameters|Conjecture|Abort)[[:space:].:]' \
             library/rocq/*.v analyses/*/rocq/*.v; then
            echo 'Proof placeholders or extra axioms are forbidden.' >&2
            exit 1
          fi

      - name: Kernel-check all proofs with Rocq 9.2
        shell: bash
        run: |
          docker run --rm \\
            -v "$PWD:/workspace:ro" \\
            rocq/rocq-prover:9.2.0 \\
            sh /workspace/scripts/compile_rocq.sh
