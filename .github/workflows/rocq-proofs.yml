name: Rocq proofs

on:
  push:
    paths:
      - 'rocq/**'
      - '.github/workflows/rocq-proofs.yml'
      - 'scripts/check_rocq_documentation.py'
  pull_request:
    paths:
      - 'rocq/**'
      - '.github/workflows/rocq-proofs.yml'
      - 'scripts/check_rocq_documentation.py'
  workflow_dispatch:

jobs:
  kernel-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check module headers and per-declaration proof documentation
        shell: bash
        run: python3 scripts/check_rocq_documentation.py

      - name: Reject unfinished proof placeholders and new axioms
        shell: bash
        run: |
          if grep -nE '^[[:space:]]*(Admitted|Axiom|Axioms|Parameter|Parameters|Conjecture|Abort)[[:space:].:]' rocq/*.v; then
            echo 'Proof placeholders or extra axioms are forbidden.' >&2
            exit 1
          fi

      - name: Kernel-check all proofs with Rocq 9.2
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD/rocq:/src:ro" \
            rocq/rocq-prover:9.2.0 \
            sh -ec 'mkdir -p /tmp/checked && cp /src/*.v /tmp/checked/ && cd /tmp/checked && rocq --version && rocq compile FiniteSum.v && rocq compile Hoeflin.v && rocq compile Admissions.v && rocq compile FiniteUnion.v && rocq compile FiniteMoments.v && rocq compile FiniteBridge.v && rocq compile FourCellBridge.v'
