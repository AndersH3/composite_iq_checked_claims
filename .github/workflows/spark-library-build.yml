name: Shared SPARK library build

on:
  push:
    paths:
      - 'library/spark/**'
      - 'analyses/**/ada/**'
      - '.github/workflows/spark-library-build.yml'
  pull_request:
    paths:
      - 'library/spark/**'
      - 'analyses/**/ada/**'
      - '.github/workflows/spark-library-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gnat-build:
    name: Compile all three SPARK/Ada consumers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out canonical report and library sources
        uses: actions/checkout@v4

      - name: Install GNAT and GPRbuild
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnat gprbuild

      - name: Enforce central source ownership
        run: bash scripts/check_library_layout.sh

      - name: Build Hoeflin/Ferguson against central SPARK sources
        shell: bash
        run: gprbuild -p -P analyses/hoeflin-ferguson/ada/hoeflin.gpr

      - name: Build Towers admissions against central SPARK sources
        shell: bash
        run: gprbuild -p -P analyses/towers-multiple-test-admissions/ada/towers.gpr

      - name: Build Sequential conditional means against central SPARK sources
        shell: bash
        run: gprbuild -p -P analyses/sequential-conditional-means/ada/sequential.gpr

      # GNATprove is a separate source-specific proof campaign. This job
      # checks syntax, type compatibility, linking and actual shared reuse;
      # do not label successful compilation as a discharged SPARK VC.

      - name: Regression test canonical sampler and report adapters
        shell: bash
        run: |
          gnatmake -gnat2022 -gnata -gnato \
            -Ianalyses/hoeflin-ferguson/ada/src \
            -Ianalyses/sequential-conditional-means/ada/src \
            -Ilibrary/spark/src \
            tests/ada/shared_normal_smoke.adb \
            -o shared_normal_smoke -largs -lm
          ./shared_normal_smoke
