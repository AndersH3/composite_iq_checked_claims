name: Gaussian CE dependency compatibility (Rocq 9.0.1)

on:
  push:
    paths:
      - 'analyses/sequential-conditional-means/formalml/**'
      - '.github/workflows/gaussian-formalml-rocq901.yml'
  pull_request:
    paths:
      - 'analyses/sequential-conditional-means/formalml/**'
      - '.github/workflows/gaussian-formalml-rocq901.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  formalml-upstream-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4

      - name: Reject proof placeholders
        shell: bash
        run: |
          if grep -nE '^[[:space:]]*(Admitted|Axiom|Axioms|Parameter|Parameters|Conjecture|Abort)[[:space:].:]' analyses/sequential-conditional-means/formalml/*.v; then
            echo 'No new axioms or placeholders permitted.' >&2
            exit 1
          fi
          test "$(grep -Ec "^[[:space:]]*Theorem " analyses/sequential-conditional-means/formalml/GaussianProductConditionalExpectation.v)" -eq 2

      - name: Test against FormalML's upstream Rocq 9.0.1 environment
        shell: bash
        run: |
          # Diagnostic check only: the canonical project kernel is Rocq 9.2.
          # FormalML upstream tests on the 9.0.1 OCaml 4.14.2 image.
          docker run --rm -v "$PWD:/workspace:ro" rocq/rocq-prover:9.0.1-ocaml-4.14.2-flambda sh -euc '
            opam update -y
            git clone --depth 1 https://github.com/IBM/FormalML.git /tmp/FormalML
            cd /tmp/FormalML
            git fetch --depth 1 origin 8ee433dc802fca35f6bceb6dacb69d3c1315e886
            git checkout --detach 8ee433dc802fca35f6bceb6dacb69d3c1315e886
            opam install -y -j 2 --deps-only .
            opam exec -- make Makefile.rocq
            opam exec -- make -j 2 -f Makefile.rocq \
              rocq/ProbTheory/ConditionalExpectation.vo \
              rocq/ProbTheory/ProductSpace.vo
            mkdir -p /tmp/formalml-gaussian
            cp /workspace/analyses/sequential-conditional-means/formalml/*.v /tmp/formalml-gaussian/
            cd /tmp/formalml-gaussian
            opam exec -- rocq compile -R /tmp/FormalML/rocq FormalML GaussianResidualConditionalExpectation.v
            opam exec -- rocq compile -R /tmp/FormalML/rocq FormalML GaussianProductConditionalExpectation.v
          '
