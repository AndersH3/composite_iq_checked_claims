name: Python contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Require at least five Deal contracts on every named function
        run: python verification/check_contract_coverage.py
      - name: Require five explicit clauses/flow contracts on every SPARK interface
        run: python verification/spark_contracts.py
      - name: Static lint with a checked negative control
        run: python verification/check_static_lint.py
      - name: Runtime and property tests
        run: python -m pytest -q tests
      - name: Symbolically verify the two pure acceptance gates
        run: |
          python -m deal prove --skipped --nocolor verification/proof_gate.py | tee proof-gate.log
          test "$(grep -c 'proved! post-condition' proof-gate.log)" -eq 2
          if grep -E 'skipped|failed' proof-gate.log; then exit 1; fi
      - name: Audit current five-contract SPARK evidence
        run: python verification/verify_evidence.py
      - name: Audit prior SPARK campaigns against their explicit source revision
        run: |
          git worktree add --detach "$RUNNER_TEMP/composite-iq-prior-source" 2c32ecdd87690866bfcbf2d99725abba7cdad55e
          for campaign in computer10-20261031 deal-spark-computer10-20261031 deal-lint-spark-computer10-20261031; do
            python verification/verify_evidence.py "verification/evidence/$campaign" --source-root "$RUNNER_TEMP/composite-iq-prior-source"
          done
          git worktree add --detach "$RUNNER_TEMP/composite-iq-expanded-source" ce0e895e472de86a6760f05a34d654f32ab0820e
          python verification/verify_evidence.py verification/evidence/spark-expanded-computer10-20261031 --source-root "$RUNNER_TEMP/composite-iq-expanded-source"
          git worktree add --detach "$RUNNER_TEMP/composite-iq-ghost-source" 2a8e983fb3c8b90436b89db6e6adfe170872f5f5
          python verification/verify_evidence.py verification/evidence/ghost-boundaries-computer10-20261101 --source-root "$RUNNER_TEMP/composite-iq-ghost-source"
